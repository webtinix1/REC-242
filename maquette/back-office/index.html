<script src="../assets/js/runtime.js"></script></head><body><div id="root"></div><template id="tpl">

<div class="bb" data-title="{{title}}">

<!-- ============ CONNEXION ============ -->
<template data-sc="if" value="{{is.connexion}}" hint-placeholder-val="{{false}}">
<div class="login">
<div class="login-card">
<img class="login-logo" src="../assets/img/f6779f244cac3dcb9222d4a0093b2443.jpg" alt="REC 242">
<span class="pill">Back-office</span>
<p class="small muted">Accès réservé aux comptes d'administration de REC 242 et à Webtinix pour la maintenance. Chaque connexion est inscrite au journal des actions.</p>
<template data-sc="if" value="{{auth.login}}" hint-placeholder-val="{{true}}">
<h1 class="h1">Connexion à l'administration</h1>
<div class="rec-field"><label for="bb-mail">E-mail</label><input id="bb-mail" class="rec-input" type="email" autocomplete="username"></div>
<div class="rec-field"><label for="bb-pw">Mot de passe</label><input id="bb-pw" class="rec-input" type="password" autocomplete="current-password"></div>
<button type="button" class="rec-btn rec-btn--primary" onClick="{{enter}}">Se connecter</button>
<button type="button" class="linkbtn" onClick="{{T.forgot}}">Mot de passe oublié ?</button>
<p class="small muted">Après 5 tentatives échouées, le compte est bloqué 15 minutes. Une connexion depuis un nouvel appareil déclenche une alerte par e-mail. Déconnexion automatique après 30 minutes d'inactivité.</p>
</template>

</div>
</div>
</template>

<!-- ============ COQUILLE ============ -->
<div class="shell">
<aside class="side open-{{menuOpen}}" aria-label="Menu d'administration">
<div class="side-head"><img src="../assets/img/f6779f244cac3dcb9222d4a0093b2443.jpg" alt="REC 242"><span class="pill">Back-office</span></div>
<template data-sc="for" list="{{side}}" as="g" hint-placeholder-count="5"><div class="side-group"><p class="side-t">{{g.t}}</p>
<template data-sc="for" list="{{g.items}}" as="i" hint-placeholder-count="3"><button type="button" class="side-i {{i.cls}}" onClick="{{i.go}}"><span class="side-dot" aria-hidden="true"></span><span class="side-l">{{i.label}}</span><template data-sc="if" value="{{i.hasBadge}}" hint-placeholder-val="{{false}}"><span class="badge">{{i.badge}}</span></template></button></template>
</div></template>
</aside>
<div class="main">
<header class="top">
<button type="button" class="menubtn" onClick="{{toggleMenu}}" aria-label="Ouvrir ou fermer le menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
<h1 class="top-t">{{title}}</h1>
<div class="top-search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><label for="bb-s" class="sr">Rechercher</label><input id="bb-s" type="search" placeholder="Rechercher un membre, une candidature…"></div>
<div class="me"><span class="av av-photo">BB<img src="{{pp.beryl}}" alt="Béryl Bobanda"></span><span class="me-l"><b>Béryl Bobanda</b><span>Responsable membres</span></span></div>
<button type="button" class="iconbtn" onClick="{{logout}}" aria-label="Se déconnecter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4"></path><path d="M10 8l-4 4 4 4M6 12h10"></path></svg></button>
</header>
<div class="content">
<template data-sc="if" value="{{toastOn}}" hint-placeholder-val="{{false}}"><div class="toast" role="status"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg><span>{{toast}}</span><button type="button" class="linkbtn" onClick="{{closeToast}}">Fermer</button></div></template>

<!-- ============ TABLEAU DE BORD ============ -->
<template data-sc="if" value="{{is.tableau}}" hint-placeholder-val="{{true}}">
<p class="muted">Bonjour. Voici ce qui attend une action aujourd'hui.</p>
<div class="kpis">
<button type="button" class="kpi kpi-alert" onClick="{{go.candidatures}}"><span class="kpi-dot"></span><b>{{dash.cand}}</b><span>Candidatures en attente</span><small>La plus ancienne : {{dash.oldest}}</small></button>
<button type="button" class="kpi" onClick="{{go.membres}}"><span class="kpi-dot"></span><b>{{dash.modifs}}</b><span>Demandes de modification</span><small>Fiches membres</small></button>
<button type="button" class="kpi" onClick="{{go.messages}}"><span class="kpi-dot"></span><b>{{dash.msgs}}</b><span>Messages non traités</span><small>Par motif ci-dessous</small></button>
<button type="button" class="kpi" onClick="{{go.opportunites}}"><span class="kpi-dot"></span><b>{{dash.expire}}</b><span>Opportunité expire cette semaine</span><small>Dans 6 jours</small></button>
</div>
<div class="grid2">
<section class="panel"><div class="panel-h"><h2 class="h2">Prochains événements</h2><button type="button" class="linkbtn" onClick="{{go.evenements}}">Tous</button></div>
<template data-sc="for" list="{{evs}}" as="e" hint-placeholder-count="4"><button type="button" class="ev" onClick="{{e.go}}"><div class="ev-t"><b>{{e.titre}}</b><span class="small muted">{{e.date}} · {{e.fill}} inscrits</span></div><div class="bar" aria-label="Taux de remplissage {{e.pctL}}"><span style="{{e.pctStyle}}"></span></div><span class="rec-badge rec-badge--{{e.cls}}">{{e.statut}}</span></button></template>
</section>
<section class="panel"><div class="panel-h"><h2 class="h2">Messages par motif</h2><button type="button" class="linkbtn" onClick="{{go.messages}}">Tous</button></div>
<template data-sc="for" list="{{msgs}}" as="m" hint-placeholder-count="5"><div class="row"><span class="pill">{{m.motif}}</span><span class="row-t">{{m.objet}}</span><span class="rec-badge rec-badge--{{m.cls}}">{{m.st}}</span></div></template>
</section>
</div>
<section class="panel"><div class="panel-h"><h2 class="h2">À suivre</h2></div>
<template data-sc="for" list="{{suivre}}" as="x" hint-placeholder-count="4"><button type="button" class="row rowbtn" onClick="{{x.go}}"><span class="badge">{{x.n}}</span><span class="row-t">{{x.t}}</span><span class="small muted">{{x.where}} →</span></button></template>
</section>
<section class="panel"><div class="panel-h"><h2 class="h2">Raccourcis</h2></div>
<div class="quick"><button type="button" class="qbtn" onClick="{{go.editeur}}">Rédiger une actualité</button><button type="button" class="qbtn" onClick="{{newEvent}}">Créer un événement</button><button type="button" class="qbtn" onClick="{{go.opportunite}}">Publier une opportunité</button><button type="button" class="qbtn" onClick="{{go.cotisations}}">Relancer les cotisations</button></div>
</section>
</template>

<!-- ============ CANDIDATURES ============ -->
<template data-sc="if" value="{{is.candidatures}}" hint-placeholder-val="{{false}}">
<div class="bar-actions"><div class="chips"><template data-sc="for" list="{{cfilters}}" as="f" hint-placeholder-count="6"><button type="button" class="chip {{f.cls}}" onClick="{{f.pick}}">{{f.label}} <span class="cnt">{{f.n}}</span></button></template></div><div class="rec-row"><button type="button" class="rec-btn rec-btn--secondary" onClick="{{T.export}}">Exporter</button><button type="button" class="rec-btn rec-btn--primary" onClick="{{openPaper}}">Saisir une candidature papier</button></div></div>
<template data-sc="if" value="{{paperOpen}}" hint-placeholder-val="{{false}}">
<section class="panel paper"><div class="panel-h"><div><h2 class="h2">Candidature papier</h2><p class="small muted">Bulletin rempli à la main lors d'un événement ou au siège. Les mêmes contrôles s'appliquent : anti-doublon, trois secteurs au maximum.</p></div><button type="button" class="linkbtn" onClick="{{closePaper}}">Fermer</button></div>
<div class="form">
<div class="rec-field"><label for="bb-pn">Nom et prénom</label><input id="bb-pn" class="rec-input" type="text" value="Bienvenu Kaya"></div>
<div class="rec-field"><label for="bb-pt">Téléphone ou WhatsApp</label><input id="bb-pt" class="rec-input" type="tel" value="+242 06 538 71 09"></div>
<div class="rec-field"><label for="bb-pe">E-mail</label><input id="bb-pe" class="rec-input" type="email" value="bienvenu.kaya@gmail.com"></div>
<div class="rec-field"><label for="bb-pr">Activité ou raison sociale</label><input id="bb-pr" class="rec-input" type="text" value="Kaya Menuiserie"></div>
<div class="rec-field"><label for="bb-pc">Catégorie</label><select id="bb-pc" class="rec-input"><option>A · Individuel, informel, porteur de projet</option><option>B · Établissement, commerçant formalisé</option><option>C · Entreprise, société</option><option>Expert</option><option>Partenaire</option><option>Membre d’honneur</option></select></div>
<div class="rec-field"><label for="bb-pv">Ville</label><select id="bb-pv" class="rec-input"><option>Brazzaville</option><option>Pointe-Noire</option><option>Dolisie</option><option>Nkayi</option><option>Ouesso</option><option>Diaspora / Autre</option></select></div>
<div class="rec-field"><label for="bb-ps">Secteurs (3 au maximum)</label><input id="bb-ps" class="rec-input" type="text" value="Artisanat, BTP"></div>
<div class="rec-field"><label for="bb-pl">Reçu lors de</label><select id="bb-pl" class="rec-input"><option>Afterwork du 14 novembre 2026</option><option>Passage au siège</option></select></div>
<div class="rec-field full"><label>Bulletin signé</label><div class="drop">bulletin-bienvenu-kaya.pdf · scanné le 15 nov. 2026</div></div>
</div>
<label class="check-inline"><input type="checkbox" checked> Consentement et charte signés sur le bulletin papier</label>
<template data-sc="if" value="{{paperSent}}" hint-placeholder-val="{{false}}"><div class="ok">Dossier C-0044 créé au statut « Reçue ». Aucun doublon trouvé. Un e-mail de confirmation a été envoyé au candidat.</div></template>
<div class="rec-row"><button type="button" class="rec-btn rec-btn--primary" onClick="{{savePaper}}">Enregistrer le dossier</button></div>
</section>
</template>
<div class="tblwrap"><table class="tbl">
<thead><tr><th scope="col">Dossier</th><th scope="col">Candidat</th><th scope="col">Catégorie</th><th scope="col">Secteur · ville</th><th scope="col">Reçue</th><th scope="col">Paiement</th><th scope="col">Statut</th><th scope="col"><span class="sr">Action</span></th></tr></thead>
<tbody><template data-sc="for" list="{{cands}}" as="c" hint-placeholder-count="6"><tr><td class="mono">{{c.ref}}</td><td data-label="Candidat"><span class="ent-cell"><img class="face" src="{{c.photo}}" alt="{{c.nom}}"><span><b>{{c.nom}}</b><br><span class="small muted">{{c.ent}}</span></span></span></td><td data-label="Catégorie"><span class="cat">{{c.cat}}</span></td><td data-label="Secteur">{{c.sect}} · {{c.ville}}</td><td data-label="Reçue">{{c.recue}}</td><td data-label="Paiement" class="small">{{c.paye}}</td><td data-label="Statut"><span class="rec-badge rec-badge--{{c.cls}}">{{c.statut}}</span></td><td><button type="button" class="linkbtn" onClick="{{c.go}}">Ouvrir</button></td></tr></template></tbody>
</table></div>
<p class="small muted">Les candidatures en double sont bloquées à l'envoi (même e-mail ou même téléphone).</p>
</template>

<!-- ============ CANDIDATURE (détail) ============ -->
<template data-sc="if" value="{{is.candidature}}" hint-placeholder-val="{{false}}">
<button type="button" class="linkbtn" onClick="{{go.candidatures}}">← Candidatures</button>
<div class="head-card"><span class="av av-lg av-photo">{{cand.ini}}<img src="{{cand.photo}}" alt="{{cand.nom}}"></span><div><p class="small muted mono">Dossier {{cand.ref}} · reçue {{cand.recue}}</p><h2 class="h1">{{cand.nom}}</h2><p class="muted">{{cand.ent}} · {{cand.sect}} · {{cand.ville}} · catégorie {{cand.cat}}</p></div><span class="rec-badge rec-badge--{{cstatCls}}">{{cstat}}</span></div>
<div class="grid2 grid-wide">
<div class="stack">
<section class="panel"><h3 class="h3">Statut du dossier</h3>
<div class="chips"><template data-sc="for" list="{{cstatuts}}" as="s" hint-placeholder-count="7"><button type="button" class="chip {{s.cls}}" onClick="{{s.pick}}">{{s.label}}</button></template></div>
<template data-sc="if" value="{{refus}}" hint-placeholder-val="{{false}}"><div class="warn"><div class="rec-field"><label for="bb-motif">Motif du refus (obligatoire)</label><textarea id="bb-motif" class="rec-input"></textarea></div><p class="small">Un e-mail courtois, reprenant ce motif, sera envoyé au candidat. Le remboursement éventuel suit la règle fixée par le comité de direction.</p><button type="button" class="rec-btn rec-btn--secondary" onClick="{{T.refus}}">Envoyer l'e-mail de refus</button></div></template>
<div class="rec-row"><button type="button" class="rec-btn rec-btn--secondary" onClick="{{cm.complement}}">Demander un complément</button><button type="button" class="rec-btn rec-btn--primary" onClick="{{convert}}">Convertir en membre</button></div>
<template data-sc="if" value="{{isActive}}" hint-placeholder-val="{{false}}"><div class="ok">Fiche membre créée, lien d'activation envoyé (valable 72 h).</div></template>
</section>
<section class="panel"><h3 class="h3">Dossier</h3>
<dl class="dl">
<dt>Téléphone</dt><dd>{{cand.tel}}</dd><dt>E-mail</dt><dd>{{cand.mail}}</dd>
<dt>Tranche d'âge</dt><dd>{{cand.age}}</dd><dt>Forme juridique</dt><dd>{{cand.forme}}</dd>
